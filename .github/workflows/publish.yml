name: Publish to Open VSX

on:
  push:
    tags:
      - 'v*'

# GitHub deprecated Node 20 runners for JS actions (forced to Node 24 from 2026-06-02).
# This flag runs checkout/setup-node/upload-artifact@v4 on the Node 24 runtime.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install vsce and ovsx
        run: npm install -g @vscode/vsce ovsx

      - name: Package VSIX
        run: vsce package --allow-missing-repository

      - name: Publish to Open VSX
        run: ovsx publish *.vsix -p ${{ secrets.OVSX_TOKEN }}

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: '*.vsix'
